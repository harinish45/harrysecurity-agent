{{- /*
Chart-managed Secret for LLM provider credentials (OPENAI_API_KEY,
ANTHROPIC_API_KEY, GROQ_API_KEY, etc. — see .env.example) and
NEXUS_MASTER_KEY (nexus/foundation/secrets.py), keyed by .Values.secrets.data.

Only rendered when the operator has NOT pointed the chart at an
externally-managed Secret (.Values.secrets.existingSecret) and has actually
supplied data — .Values.secrets.data defaults to {} and MUST NOT contain
real values in the committed values.yaml. Populate it at install/upgrade
time instead, e.g.:
  helm upgrade --install nexus deploy/helm/nexus-strike \
    --set-string secrets.data.LLM_PROVIDER=openai \
    --set-string secrets.data.OPENAI_API_KEY=sk-... \
    --set-string secrets.data.NEXUS_MASTER_KEY=$(openssl rand -base64 32)
or from an untracked values file (-f secrets.local.yaml, kept out of git).

Note this still lands the values in `helm get values`/release history in
plaintext, same as any Helm-templated Secret — for that reason prefer
.Values.secrets.existingSecret (a Secret you create out-of-band via kubectl,
External Secrets Operator, Sealed Secrets, etc.) for real production use.
*/ -}}
{{- if and (not .Values.secrets.existingSecret) .Values.secrets.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus-strike.secretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "nexus-strike.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
