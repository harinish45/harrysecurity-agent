{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nexus-strike.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nexus-strike.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # Same-namespace traffic is always allowed. Kubernetes scopes a peer
        # with no namespaceSelector to the NetworkPolicy's own namespace, so
        # this does NOT open the service up cluster-wide.
        - podSelector: {}
        {{- if .Values.networkPolicy.allowedIngressNamespaceSelector }}
        # Only rendered when allowedIngressNamespaceSelector is a non-empty
        # selector. An EMPTY selector ({}) is deliberately never rendered
        # here: per Kubernetes API semantics an empty namespaceSelector
        # matches every namespace in the cluster, which would defeat this
        # policy entirely.
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.allowedIngressNamespaceSelector | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8765
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
