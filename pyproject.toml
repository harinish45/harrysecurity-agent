[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-strike"
version = "1.0.0"
description = "The Ultimate AI-Powered Cybersecurity Platform — 29 domains, 270+ tools, 50 agents, 10 LLM providers"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["security", "penetration-testing", "osint", "red-team", "blue-team", "llm", "ai-security", "vulnerability-scanner", "sast", "dast"]
license = "MIT"
authors = [
    {name = "NEXUS-STRIKE Team"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Penetration Testing",
    "Topic :: Security :: Vulnerability Management",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    # CLI & UI
    "typer>=0.9.0",
    "rich>=13.7.0",

    # LLM Providers
    "openai>=1.35.0",
    "anthropic>=0.39.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # HTTP & Networking
    "httpx>=0.27.0",
    "requests>=2.31.0",

    # Web Server
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",

    # Docker
    "docker>=7.1.0",

    # Data Processing
    "pyyaml>=6.0",
    "orjson>=3.9.0",
    "networkx>=3.0",

    # Auth / Secrets
    "bcrypt>=4.0",
    "pyotp>=2.9",
    # >=45 for ML-DSA (post-quantum signing) support in
    # nexus/advanced/pq_signing.py; older versions still work for the
    # secrets vault (Fernet), just without that one optional feature.
    "cryptography>=45.0",

    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
advanced = [
    # nexus/advanced/notarization.py — optional; that module degrades to a
    # clear NotarizationError (not a crash) if this isn't installed.
    "opentimestamps-client>=0.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
all = [
    "openai>=1.35.0",
    "anthropic>=0.39.0",
    "fastapi>=0.110.0",
    "docker>=7.1.0",
    "pydantic>=2.7.0",
]

[project.scripts]
nexus = "nexus.cli:app"

[project.urls]
Homepage = "https://github.com/harinish45/nexus-strike"
Repository = "https://github.com/harinish45/nexus-strike"
Issues = "https://github.com/harinish45/nexus-strike/issues"
Documentation = "https://github.com/harinish45/nexus-strike/blob/main/README.md"

[tool.pytest.ini_options]
# Manual, target-specific assessment scripts must not be auto-collected.
# The test suite is self-contained and never contacts the public internet.
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]