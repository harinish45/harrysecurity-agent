[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-strike"
version = "1.0.0"
description = "The Ultimate AI-Powered Cybersecurity Platform — 30 domains, 283 tools, 62 agents, 10 LLM providers, guarded tool execution"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["security", "penetration-testing", "osint", "red-team", "blue-team", "llm", "ai-security", "vulnerability-scanner"]
license = "MIT"
authors = [
    {name = "NEXUS-STRIKE Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Penetration Testing",
    "Topic :: Security :: Vulnerability Management",
]

dependencies = [
    "typer>=0.9.0",
    "click>=8.0.0,<8.2",
    "rich>=13.7.0",
    "openai>=1.35.0",
    "anthropic>=0.39.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "docker>=7.1.0",
    "pyyaml>=6.0",
    "orjson>=3.9.0",
    "networkx>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "dnspython>=2.4.0",
    "beautifulsoup4>=4.12.0",
    "weasyprint>=60.0",
    "xhtml2pdf>=0.2.11",
    "pypdf>=3.1.0",
    "jinja2>=3.1.0",
    "ldap3>=2.9",  # real LDAP SPN enumeration in nexus/tools/active_directory/kerberoast.py
    "psutil>=5.9",  # cross-platform process resource-limit enforcement (nexus/tools/sandbox.py)
    "mcp>=2.2.0",  # real Model Context Protocol server (nexus/mcp/server.py, `nexus mcp`)

    # Auth / Secrets
    "bcrypt>=4.0",
    "pyotp>=2.9",
    # >=45 for ML-DSA (post-quantum signing) support in
    # nexus/advanced/pq_signing.py; older versions still work for the
    # secrets vault (Fernet), just without that one optional feature.
    "cryptography>=45.0",

    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
advanced = [
    # nexus/advanced/notarization.py — optional; that module degrades to a
    # clear NotarizationError (not a crash) if this isn't installed.
    "opentimestamps-client>=0.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "hypothesis>=6.100",  # property-based/fuzz testing of the guardrail chain
]

[project.scripts]
nexus = "nexus.cli:app"

[project.urls]
Homepage = "https://github.com/harinish45/harrysecurity-agent"
Repository = "https://github.com/harinish45/harrysecurity-agent"
Issues = "https://github.com/harinish45/harrysecurity-agent/issues"
Documentation = "https://github.com/harinish45/harrysecurity-agent/blob/master/README.md"

[tool.pytest.ini_options]
# Manual, target-specific assessment scripts must not be auto-collected.
# The test suite is self-contained and never contacts the public internet
# by default — a handful of opt-in tests marked "slow" do real live network
# calls against safe, well-known hosts; run without `-k "not slow"` to
# include them.
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: makes a real live network call against an external host; excluded by default via -k \"not slow\"",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*", "web*"]

[tool.setuptools.package-data]
web = ["static/**/*", "templates/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["nexus_test_*", "engagements", "benchmarks"]

[tool.ruff.lint]
# Scoped to the highest-value categories found by this session's
# architecture audit (real unused imports/undefined names/bare excepts —
# 1850 pre-existing hits across the tool layer, tracked but not fixed in
# this pass; CI runs `ruff check` advisory-only via `|| echo`, see
# .github/workflows/ci.yml, so this config checking real code doesn't
# block anyone — it's here so *new* code gets caught going forward).
select = ["F", "E7", "E9", "B"]
ignore = [
    "E731",  # lambda assignment — used deliberately in a few dispatch tables
    "B008",  # typer's `= typer.Option(...)`/`typer.Argument(...)` CLI-param pattern is a false positive here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.mypy]
# Deliberately unpinned: the project supports 3.10-3.12 (see classifiers
# above), but pinning `python_version` here to the floor made mypy parse
# third-party stubs (e.g. numpy's, which use 3.12 `type` syntax) as if
# they had to be 3.10-compatible and crash outright. Let it default to
# whatever interpreter actually runs mypy in each environment.
ignore_missing_imports = true
# Codebase predates type-checking; enabling this only for the newer,
# hand-typed core (orchestration/foundation) where mypy already runs clean
# — see this session's audit for the full 224-error repo-wide baseline.
warn_unused_ignores = false
exclude = ["nexus_test_.*", "build/"]

[[tool.mypy.overrides]]
module = "nexus.tools.*"
ignore_errors = true
