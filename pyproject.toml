[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-strike"
version = "1.0.0"
description = "AI-assisted cybersecurity assessment platform with guarded tool execution"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["security", "penetration-testing", "osint", "red-team", "blue-team", "llm", "ai-security", "vulnerability-scanner"]
license = "MIT"
authors = [
    {name = "NEXUS-STRIKE Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Penetration Testing",
    "Topic :: Security :: Vulnerability Management",
]

dependencies = [
    "typer>=0.9.0",
    "click>=8.0.0,<8.2",
    "rich>=13.7.0",
    "openai>=1.35.0",
    "anthropic>=0.39.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "docker>=7.1.0",
    "pyyaml>=6.0",
    "orjson>=3.9.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "dnspython>=2.4.0",
    "beautifulsoup4>=4.12.0",
    "weasyprint>=60.0",
    "xhtml2pdf>=0.2.11",
    "pypdf>=3.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
nexus = "nexus.cli:app"

[project.urls]
Homepage = "https://github.com/harinish45/harrysecurity-agent"
Repository = "https://github.com/harinish45/harrysecurity-agent"
Issues = "https://github.com/harinish45/harrysecurity-agent/issues"
Documentation = "https://github.com/harinish45/harrysecurity-agent/blob/master/README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]
