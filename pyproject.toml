[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-strike"
version = "0.2.0"
description = "The Ultimate AI-Powered Cybersecurity Platform — 29 domains, 263 tools, 50 agents, 10 LLM providers"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["security", "penetration-testing", "osint", "red-team", "blue-team", "llm", "ai-security"]
license = "MIT"
authors = [
    {name = "NEXUS-STRIKE Team"},
]

dependencies = [
    # CLI & UI
    "typer>=0.9.0",
    "rich>=13.7.0",

    # LLM Providers
    "openai>=1.35.0",
    "anthropic>=0.39.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # HTTP & Networking
    "httpx>=0.27.0",
    "requests>=2.31.0",

    # Web Server
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",

    # Docker
    "docker>=7.1.0",

    # Data Processing
    "pyyaml>=6.0",
    "orjson>=3.9.0",

    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
]
all = [
    "openai>=1.35.0",
    "anthropic>=0.39.0",
    "fastapi>=0.110.0",
    "docker>=7.1.0",
    "pydantic>=2.7.0",
]

[project.scripts]
nexus = "nexus.cli:app"

[project.urls]
Homepage = "https://github.com/nexus-strike/nexus-strike"
Repository = "https://github.com/nexus-strike/nexus-strike"
Documentation = "https://nexus-strike.readthedocs.io"

[tool.pytest.ini_options]
# Manual, target-specific assessment scripts must not be auto-collected.
# The test suite is self-contained and never contacts the public internet.
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]
