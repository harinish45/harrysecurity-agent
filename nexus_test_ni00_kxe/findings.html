<style>

  body { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; background:#f5f6fa; color:#172033; padding:2rem }
  .container { max-width:1100px; margin:0 auto }
  h1 { font-size:1.75rem; margin-bottom:.25rem; color:#0a1628 }
  .subtitle { color:#5e6c84; margin-bottom:2rem; font-size:.9rem }
  .summary-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1rem; margin-bottom:2rem }
  .card { background:#fff; border-radius:8px; padding:1.25rem; box-shadow:0 1px 3px rgba(0,0,0,.08) }
  .card .count { font-size:2rem; font-weight:700 }
  .card .label { font-size:.8rem; color:#5e6c84; text-transform:uppercase; letter-spacing:.5px }
  .critical .count { color:#b42318 } .high .count { color:#b54708 }
  .medium .count { color:#dc6803 } .low .count { color:#175cd3 } .info .count { color:#5e6c84 }
  table { width:100%; border-collapse:separate; border-spacing:0; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08) }
  th,td { padding:.75rem 1rem; text-align:left; vertical-align:top; border-bottom:1px solid #eef2f8 }
  th { background:#eef2f8; font-weight:600; font-size:.8rem; text-transform:uppercase; letter-spacing:.5px; color:#5e6c84 }
  tr:last-child td { border-bottom:none }
  .sev-critical,.sev-high { color:#b42318; font-weight:600 }
  .sev-medium { color:#dc6803; font-weight:600 }
  .sev-low { color:#175cd3; font-weight:600 }
  .sev-info { color:#5e6c84 }
  .evidence { font-family:'SF Mono','Cascadia Code','Fira Code',monospace; font-size:.8rem; background:#f8f9fc; padding:.5rem; border-radius:4px; white-space:pre-wrap; max-height:120px; overflow-y:auto }
  .tag { display:inline-block; font-size:.7rem; padding:2px 8px; border-radius:10px; font-weight:600 }
  .tag-critical { background:#fef3f2; color:#b42318 } .tag-high { background:#fffaeb; color:#b54708 }
  .tag-medium { background:#fffaeb; color:#dc6803 } .tag-low { background:#eff8ff; color:#175cd3 }
  .tag-info { background:#f8f9fc; color:#5e6c84 }
  .footer { margin-top:2rem; font-size:.8rem; color:#5e6c84; text-align:center }
</style>
</head>
<body>
<div class="container">

<div class="card high"><div class="count">1</div><div class="label">high</div></div>
<div class="card medium"><div class="count">0</div><div class="label">medium</div></div>
<div class="card low"><div class="count">0</div><div class="label">low</div></div>
<div class="card info"><div class="count">0</div><div class="label">info</div></div></div>

  <table>
    <thead><tr>
      <th>ID</th><th>Severity</th><th>Title</th><th>Asset</th><th>Evidence</th><th>Remediation</th>
    </tr></thead>
    <tbody><tr><td><strong></strong></td><td class="sev-high"><span class="tag tag-high">HIGH</span></td><td>&lt;unsafe markup&gt;<br><small style="color:#5e6c84"></small></td><td></td><td><div class="evidence">proof</div></td><td></td></tr></tbody>

</div>
</body>
