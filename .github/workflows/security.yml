name: Security Hardening

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-and-static-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Note: syntax/undefined-name validation (ruff --select E9,F63,F7,F82)
      # already runs in ci.yml on every push/PR; it is not a security-specific
      # lint, so it is intentionally not duplicated in this workflow. The
      # security-relevant static analysis here starts with Bandit below.

      # Mirrors ci.yml's deliberate HIGH-only gate (see docs/production_readiness.md
      # milestone 5): the existing HIGH/CVE baseline is triaged, but this codebase
      # has 147 pre-existing LOW/MEDIUM Bandit findings (e.g. B104
      # hardcoded_bind_all_interfaces, B108 hardcoded_tmp_directory, B110
      # try_except_pass) that are legitimate advisory noise, not blockers.
      # Gating on those here (rather than only HIGH, as ci.yml does) would
      # make this job permanently red regardless of real risk.
      - name: Bandit source scan (blocking on HIGH severity)
        run: |
          bandit -q -r nexus -x tests -lll
          echo "--- Full report including MEDIUM/LOW (advisory, not blocking) ---"
          bandit -q -r nexus -x tests || echo "Bandit found MEDIUM/LOW issues — review, but not build-blocking (see docs/production_readiness.md)"

      - name: Python dependency audit
        # Scan the same pinned lock file ci.yml audits (and that the Docker
        # image actually installs from), not the -e ".[dev]" environment
        # installed above — a bare `pip-audit` introspects whatever's
        # currently installed, which can silently diverge from
        # requirements.lock.txt (e.g. a stale lock file, or dev-only extras
        # pulling in packages the shipped image never has) and report a
        # different vulnerable-package set than ci.yml's own audit.
        run: pip-audit -r requirements.lock.txt

      - name: Build image
        run: docker build --tag nexus-strike:security .

      # TEMPORARY debug step: Trivy keeps reporting msgpack==1.1.2 /
      # setuptools==70.3.0 as installed even after the runtime stage's
      # explicit `pip install --upgrade` (confirmed via this job's own
      # build log to actually install msgpack-1.2.2/setuptools-84.0.0),
      # and neither old version string appears anywhere else in this
      # job's logs. Enumerating the real, running container's filesystem
      # directly to get ground truth on whether a second, stale
      # dist-info/egg-info actually exists on disk, or whether this is a
      # Trivy-side detection quirk. Remove once resolved.
      - name: DEBUG - inspect installed setuptools/msgpack in the built image
        run: |
          echo "--- pip list (authoritative installed versions) ---"
          docker run --rm nexus-strike:security python -m pip list | grep -i "setuptools\|wheel\|msgpack\|pip "
          echo "--- every setuptools/msgpack/wheel dist-info or egg-info dir anywhere in the image ---"
          docker run --rm --entrypoint find nexus-strike:security / -iname "*setuptools*" -o -iname "*msgpack*" 2>/dev/null | grep -v "^/proc\|^/sys"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-strike:security
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  helm-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint deploy/helm/nexus-strike
