name: Security Hardening

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-and-static-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff syntax/error validation
        run: ruff check . --select E9,F63,F7,F82 --output-format=github

      - name: Bandit source scan
        shell: bash
        run: |
          set +e
          bandit -r nexus -x tests -f json -o bandit-report.json
          status=$?
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("bandit-report.json")
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              results = data.get("results", [])
              metrics = data.get("metrics", {})
              print(f"Bandit findings: {len(results)}")
              print(f"Files scanned: {len(metrics)}")
              for item in results:
                  print(
                      "::error "
                      f"file={item.get('filename')},line={item.get('line_number')},"
                      f"title={item.get('issue_text')} "
                      f"severity={item.get('issue_severity')} confidence={item.get('issue_confidence')}"
                  )
          else:
              print("::error::Bandit did not produce bandit-report.json")
          raise SystemExit(0)
          PY
          exit "$status"

      - name: Upload Bandit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Python dependency audit
        run: pip-audit

      - name: Build image
        run: docker build --tag nexus-strike:security .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-strike:security
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  helm-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint deploy/helm/nexus-strike
