name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package and development dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Static validation with Ruff
      run: ruff check . --select E9,F63,F7,F82 --output-format=github

    - name: Verify Nexus Tools
      env:
        PYTHONPATH: ${{ github.workspace }}
        NEXUS_LEGAL_ACK: I_HAVE_WRITTEN_AUTHORIZATION
      run: python -m nexus verify

    - name: Run unit tests
      env:
        PYTHONPATH: ${{ github.workspace }}
        NEXUS_LEGAL_ACK: I_HAVE_WRITTEN_AUTHORIZATION
      run: pytest tests/unit --tb=long -vv

    - name: Run integration tests
      env:
        PYTHONPATH: ${{ github.workspace }}
        NEXUS_LEGAL_ACK: I_HAVE_WRITTEN_AUTHORIZATION
      run: pytest tests/integration --tb=long -vv

    - name: Run complete test suite
      env:
        PYTHONPATH: ${{ github.workspace }}
        NEXUS_LEGAL_ACK: I_HAVE_WRITTEN_AUTHORIZATION
      run: pytest tests/ --tb=long -vv

    - name: Build package
      run: python -m build

    - name: Build Docker image
      if: matrix.python-version == '3.11'
      run: docker build --tag nexus-strike:ci .

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: reports/
        retention-days: 7
        if-no-files-found: ignore
