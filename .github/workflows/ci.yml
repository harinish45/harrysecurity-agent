name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock ruff pytest-asyncio build

    - name: Lint with Ruff
      run: |
        ruff check . || echo "Ruff check completed with warnings"

    # Advisory for now — see docs/production_readiness.md for the plan to
    # promote these to blocking once the current findings are triaged.
    # The codebase has an existing, untriaged baseline, so flipping either
    # scanner to blocking now would break CI on pre-existing findings
    # unrelated to any given PR; that's a deliberate, temporary choice.
    - name: Security scan with Bandit (advisory)
      run: |
        pip install bandit
        bandit -r nexus -ll || echo "Bandit found issues — review before the next hardening pass (see docs/production_readiness.md)"

    - name: Dependency vulnerability scan with pip-audit (advisory)
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt || echo "pip-audit found issues — review before the next hardening pass (see docs/production_readiness.md)"

    - name: Verify Nexus Tools
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python -m nexus verify

    - name: Run pytest
      env:
        PYTHONPATH: ${{ github.workspace }}
        NEXUS_LEGAL_ACK: "1"
      run: |
        pytest tests/ --tb=short -v

    - name: Build package
      run: |
        python -m build

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: reports/
        retention-days: 7
        if-no-files-found: ignore