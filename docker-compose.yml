services:
  nexus:
    build: .
    image: nexus-strike:1.0.0
    container_name: nexus-strike
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      # nexus/foundation/secrets.py encrypts its vault key/store under
      # NEXUS_VAULT_DIR (defaults to $HOME/.nexus, which is inside the
      # read_only root filesystem here and would be unwritable). Point it
      # at the bind-mounted ./vault directory below instead — a tmpfs entry
      # would silently reset the vault (and every user account) on restart.
      - NEXUS_VAULT_DIR=/app/.nexus
    volumes:
      - ./engagements:/app/engagements
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./vault:/app/.nexus
    ports:
      - "8765:8765"   # Dashboard
      - "8888:8888"   # MCP server
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - frontend
      - backend
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    # Writable paths: engagements/reports/logs/vault (bind mounts above)
    # and /tmp (tmpfs). Everything else is read-only.
    mem_limit: 2g
    cpus: 2.0

  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    volumes:
      - ollama-models:/root/.ollama
    # No host port mapping: only reachable from other containers on the
    # backend network via the "ollama" service DNS name.
    restart: unless-stopped
    networks:
      - backend
    # cap_drop/no-new-privileges intentionally omitted: this image needs
    # broader privileges for GPU/device passthrough when running with
    # hardware acceleration. Left as-is.
    # No mem_limit/cpus cap: may need to load large local models; give it
    # whatever headroom the host has.

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    # No host port mapping: only reachable from other containers on the
    # backend network via the "redis" service DNS name.
    restart: unless-stopped
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 256m
    cpus: 0.5

  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No host port mapping: only reachable from other containers on the
    # backend network via the "postgres" service DNS name.
    restart: unless-stopped
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 1g
    cpus: 1.0

volumes:
  ollama-models:
  redis-data:
  postgres-data:

networks:
  # frontend: the only network exposed to the host. Only nexus joins it,
  # since the dashboard/MCP ports are the actual product surface.
  frontend:
    driver: bridge
  # backend: internal-only network for service-to-service traffic
  # (nexus -> ollama/redis/postgres). Not reachable from the host or
  # the internet.
  backend:
    driver: bridge
    internal: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
